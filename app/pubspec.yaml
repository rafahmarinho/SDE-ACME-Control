name: acme_control
description: ACME Control - water treatment supervisory system (web, Android, iOS).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.0
  supabase_flutter: ^2.9.0
  connectivity_plus: ^7.0.0
  shared_preferences: ^2.5.0
  fl_chart: ^1.0.0
  intl: ^0.20.0
  http: ^1.3.0
  image_picker: ^1.1.0
  app_links: ^7.0.0
  flutter_secure_storage: ^9.2.4
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# flutter_secure_storage (Windows implementation) pulls in path_provider, whose
# 2.6.x Darwin implementation depends on package:objective_c, which ships a
# native build hook. The Flutter hook runner on Windows cannot compile hooks
# when the SDK lives in a path containing spaces (as on this machine), which
# breaks `flutter test` / `flutter build`. 2.5.1 is the last hook-free release.
dependency_overrides:
  path_provider_foundation: 2.5.1
